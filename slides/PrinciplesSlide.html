<link rel="stylesheet" href="../styles.css">
<div id="root"></div>
<script src="../_ds_bundle.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>

<script type="text/babel">
const { EyebrowKicker, PageIndexChip, FooterCaptionBar, NumberedBadge } = window.AcceleronixDesignSystem_3e11b3;
const principles = [
  {n:1, accent:'var(--accent-violet)', heading:'Connectivity first', body:'Every product decision starts with the network.'},
  {n:2, accent:'var(--accent-indigo)', heading:'Security by default', body:'eUICC provisioning is never optional.'},
  {n:3, accent:'var(--accent-magenta)', heading:'Built for partners', body:'OEMs integrate once, ship everywhere.'},
  {n:4, accent:'var(--accent-cyan)', heading:'Operate at scale', body:'Millions of devices, one control plane.'},
];
function Slide(){
  return (
    <div style={{width:1280,height:720,background:'#fff',boxSizing:'border-box',padding:'48px 56px',display:'flex',flexDirection:'column',fontFamily:'Arial,Helvetica,sans-serif'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>

          </div>
        ))}
      </div>
      <FooterCaptionBar date="August 2026" />

}
ReactDOM.createRoot(document.getElementById('root')).render(<Slide />);
