<!-- @dsCard group="Slides" viewport="1280x720" name="Pillar Row (3-up)" -->
<link rel="stylesheet" href="../styles.css">
<div id="root"></div>
<script src="../_ds_bundle.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script type="text/babel">
const { EyebrowKicker, PageIndexChip, FooterCaptionBar, PillarCard } = window.AcceleronixDesignSystem_3e11b3;
const pillars = [
  {icon:'globe', heading:'Global Coverage', body:'Connectivity across 180+ countries.', accent:'var(--purple)'},
  {icon:'shield-check', heading:'Secure by Design', body:'eUICC-based remote provisioning.', accent:'var(--accent-indigo)'},
  {icon:'radio-tower', heading:'Carrier Agnostic', body:'One SKU, any network, any region.', accent:'var(--accent-magenta)'},
];
function Slide(){
  return (
    <div style={{width:1280,height:720,background:'#fff',boxSizing:'border-box',padding:'48px 56px',display:'flex',flexDirection:'column',fontFamily:'Arial,Helvetica,sans-serif'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
        <div><EyebrowKicker>Why Acceleronix</EyebrowKicker><div style={{fontSize:'var(--fs-display-title)',fontWeight:700,color:'var(--ink)',marginTop:8}}>Built for scale</div></div>
        <PageIndexChip index={3} />
      </div>
      <div style={{flex:1,display:'flex',alignItems:'center',gap:32,marginTop:24}}>
        {pillars.map((p,i)=>(
          <div key={i} style={{flex:1}}>
            <PillarCard icon={<img src={`https://unpkg.com/lucide-static@latest/icons/${p.icon}.svg`} style={{width:22,height:22,filter:'invert(1)'}} />} heading={p.heading} body={p.body} accent={p.accent} />
          </div>
        ))}
      </div>
      <FooterCaptionBar date="August 2026" />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Slide />);
</script>
