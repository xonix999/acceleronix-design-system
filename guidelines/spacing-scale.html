<!-- @dsCard group="Spacing" viewport="700x140" name="Spacing Scale" subtitle="2 / 6 / 12 / 16 / 24 / 32 / 48" -->
<link rel="stylesheet" href="../styles.css">
<div style="height:140px;display:flex;align-items:flex-end;gap:10px;padding:16px;font-family:var(--font-sans);background:#fff">
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-xxs);height:40px;background:var(--accent-violet)"></div><span style="font-size:11px">xxs 2</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-xs);height:40px;background:var(--accent-violet)"></div><span style="font-size:11px">xs 6</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-sm);height:40px;background:var(--accent-violet)"></div><span style="font-size:11px">sm 12</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-md);height:40px;background:var(--accent-violet)"></div><span style="font-size:11px">md 16</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-lg);height:40px;background:var(--accent-violet)"></div><span style="font-size:11px">lg 24</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-xl);height:40px;background:var(--accent-violet)"></div><span style="font-size:11px">xl 32</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-xxl);height:40px;background:var(--accent-violet)"></div><span style="font-size:11px">xxl 48</span></div>
</div>
